# GitLab CI for dfanalyzer (converted from .github/workflows/ci.yml + cd.yml).
#
# Required CI/CD variables (set in GitLab UI → Settings → CI/CD → Variables):
#   PYPI_TOKEN — PyPI API token for the manual pypi-publish job (was secrets.PYPI_TOKEN).
#
# Publish jobs are `when: manual` and gated on v*.*.* tags, as on GitHub.

stages: [alloc, test, build, deploy, cleanup]

# LC corona CI via a single shared Flux allocation:
#  - `allocate` creates ONE 1-node allocation and saves its Flux job id to
#    .flux-jobid (artifact) so ALL jobs in the pipeline share it globally.
#  - every CI job reads the id and runs its steps via `flux proxy <jobid>`.
#  - `release-allocation` cancels it at the end (runs even on failure).
.corona-flux:
  id_tokens:
    SITE_ID_TOKEN:
      aud: https://lc.llnl.gov/gitlab
  tags: [shell, corona]
  variables:
    PYTHON_MODULE: python/3.13.2
    COMPILER_MODULE: gcc/11.2.1
    SMALL_QUEUE: pdebug
    SMALL_QUEUE_WALLTIME: 60

allocate:
  extends: .corona-flux
  stage: alloc
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_FULL_TESTS == "true"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
  script:
    - flux alloc --bg -N 1 -q "$SMALL_QUEUE" -t "${SMALL_QUEUE_WALLTIME}m" --job-name=dfanalyzer-ci
    - JOBID=$(flux job last)
    - echo "$JOBID" > .flux-jobid
    - echo "Created Flux allocation $JOBID (shared by all CI jobs)"
    - flux proxy "$JOBID" flux resource list
  artifacts:
    paths: [.flux-jobid]

# GitHub matrix (ubuntu-22.04 x python 3.10-3.13) collapsed to the LC module
# toolchain ($PYTHON_MODULE = python/3.13.2) on corona.
# One allocation; tests + docs both run on it via flux proxy.
build-and-test:
  extends: .corona-flux
  stage: test
  needs: [allocate]
  timeout: 60m
  variables:
    DFANALYZER_CLUSTER_RESTART_TIMEOUT_SECONDS: "600"
    OMPI_ALLOW_RUN_AS_ROOT: "1"
    OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      variables:
        TEST_TYPE: full
    - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_FULL_TESTS == "true"'
      variables:
        TEST_TYPE: full
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        TEST_TYPE: smoke
    - if: '$CI_PIPELINE_SOURCE == "push"'
      variables:
        TEST_TYPE: smoke
  script:
    - JOBID=$(cat .flux-jobid)
    - echo "Running test suite: $TEST_TYPE"
    # flux run -N 1 executes the script ON the allocated node; podman provides
    # the python environment (mirrors the GitHub Actions CI).
    - flux proxy "$JOBID" flux run -N 1 --env=TEST_TYPE="$TEST_TYPE" bash .gitlab/ci/build-test-docs.sh
  artifacts:
    when: always
    paths:
      - .coverage
      - coverage.xml
      - public
    expire_in: 7 days

# From cd.yml release-build: build sdist + wheel on release tags. Manual, as
# publishing is not automated during migration. Runs in its own allocation
# (manual jobs sit outside the normal one-allocation pipeline).
release-build:
  extends: .corona-flux
  stage: build
  when: manual
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
  script:
    - flux alloc --bg -N 1 -q "$SMALL_QUEUE" -t "${SMALL_QUEUE_WALLTIME}m" --job-name=dfanalyzer-release
    - JOBID=$(flux job last)
    # Pure Python: one py3-none-any wheel plus an sdist covers every
    # supported interpreter and platform.
    - flux proxy "$JOBID" flux run -N 1 bash .gitlab/ci/release-build.sh
  after_script:
    - JOBID=$(flux job last) && flux cancel "$JOBID" || true
  artifacts:
    paths: [dist/]

# From cd.yml pypi-publish: requires PYPI_TOKEN CI/CD variable. Manual.
# Network-only work — runs directly on the shell runner, no allocation.
pypi-publish:
  extends: .corona-flux
  stage: deploy
  when: manual
  needs: [release-build]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
  script:
    - module load $PYTHON_MODULE
    - python3 -m venv .venv && source .venv/bin/activate
    - pip install --upgrade twine
    - twine upload -u __token__ -p "$PYPI_TOKEN" dist/*

# Publishes the artifact from build-and-test — shell runner, no allocation.
pages:
  extends: .corona-flux
  stage: deploy
  needs: [build-and-test]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "gitlab-migration"'  # temporary: remove after merge to develop
  script:
    - echo "Publishing docs built by build-and-test"
  artifacts:
    paths: [public]

release-allocation:
  extends: .corona-flux
  stage: cleanup
  # Runs last: alloc → build-and-test → pages → deallocate.
  needs: [allocate, build-and-test, {job: pages, optional: true}]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_FULL_TESTS == "true"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: always
  script:
    - flux cancel "$(cat .flux-jobid)" || true
