# GitLab CI for dfanalyzer (converted from .github/workflows/ci.yml + cd.yml).
#
# Wheels and docs are published to the shared dldl workspace tree, not PyPI:
# PyPI releases stay on GitHub. The wheels directory holds every dftracer
# package, so one --find-links resolves dfanalyzer and dftracer-utils together.

stages: [alloc, test, build, deploy, cleanup]

# LC corona CI via a single shared Flux allocation:
#  - `allocate` creates ONE 1-node allocation and saves its Flux job id to
#    .flux-jobid (artifact) so ALL jobs in the pipeline share it globally.
#  - every CI job reads the id and runs its steps via `flux proxy <jobid>`.
#  - `release-allocation` cancels it at the end (runs even on failure).
.corona-flux:
  id_tokens:
    SITE_ID_TOKEN:
      aud: https://lc.llnl.gov/gitlab
  tags: [shell, corona]
  variables:
    PYTHON_MODULE: python/3.13.2
    COMPILER_MODULE: gcc/11.2.1
    # pbatch, as in the sibling repos: tests plus the wheel build do not
    # reliably fit the 60m pdebug walltime.
    LARGE_QUEUE: pbatch
    LARGE_QUEUE_WALLTIME: 480

allocate:
  extends: .corona-flux
  stage: alloc
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_FULL_TESTS == "true"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
  script:
    # Unique per-job name: `flux job last` is user-global and races with
    # other pipelines running under the same LC account.
    - ALLOC_NAME=dfanalyzer-ci-$CI_PIPELINE_ID-$CI_JOB_ID
    - flux alloc --bg -N 1 -q "$LARGE_QUEUE" -t "${LARGE_QUEUE_WALLTIME}m" --job-name="$ALLOC_NAME"
    - JOBID=$(flux jobs -n --name="$ALLOC_NAME" -o "{id}" | head -1)
    - test -n "$JOBID"
    - echo "$JOBID" > .flux-jobid
    - echo "Created Flux allocation $JOBID (shared by all CI jobs)"
    - flux proxy "$JOBID" flux resource list
  artifacts:
    paths: [.flux-jobid]

# GitHub matrix (ubuntu-22.04 x python 3.10-3.13) collapsed to the LC module
# toolchain ($PYTHON_MODULE = python/3.13.2) on corona.
# One allocation; tests + docs both run on it via flux proxy.
build-and-test:
  extends: .corona-flux
  stage: test
  needs: [allocate]
  timeout: 60m
  variables:
    DFANALYZER_CLUSTER_RESTART_TIMEOUT_SECONDS: "600"
    OMPI_ALLOW_RUN_AS_ROOT: "1"
    OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      variables:
        TEST_TYPE: full
    - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_FULL_TESTS == "true"'
      variables:
        TEST_TYPE: full
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        TEST_TYPE: smoke
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      variables:
        TEST_TYPE: smoke
  script:
    - JOBID=$(cat .flux-jobid)
    - 'echo "Running test suite: $TEST_TYPE"'
    # flux run -N 1 executes the script ON the allocated node; podman provides
    # the python environment (mirrors the GitHub Actions CI).
    - flux proxy "$JOBID" flux run -N 1 --env=TEST_TYPE="$TEST_TYPE" bash .gitlab/ci/build-test-docs.sh
  artifacts:
    when: always
    paths:
      - .coverage
      - coverage.xml
      - public
    expire_in: 7 days

# Pure Python: one py3-none-any wheel plus an sdist covers every supported
# interpreter and platform, so no cibuildwheel matrix is needed.
wheels:
  extends: .corona-flux
  stage: build
  needs: [allocate]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
  script:
    - JOBID=$(cat .flux-jobid)
    - flux proxy "$JOBID" flux run -N 1 bash .gitlab/ci/wheels.sh
  artifacts:
    paths: [wheelhouse/]

# Shell runner, no allocation: only copies into the workspace. Depends on both
# producers, so a failed wheel or test run publishes nothing.
distribute:
  extends: .corona-flux
  stage: deploy
  needs: [wheels, build-and-test]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
  script:
    - bash .gitlab/ci/distribute.sh

release-allocation:
  extends: .corona-flux
  stage: cleanup
  # Runs last: alloc → build-and-test → wheels → deallocate.
  needs: [allocate, build-and-test, {job: wheels, optional: true}]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_FULL_TESTS == "true"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      when: always
  script:
    - test -s .flux-jobid && flux cancel "$(cat .flux-jobid)" || true
