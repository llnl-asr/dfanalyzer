[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=64", "setuptools_scm>=8"]

[project]
name = "dftracer-analyzer"
dynamic = ["version"]
description = "Analyze, visualize, and understand I/O performance issues in HPC workflows"
authors = [{ name = "Izzet Yildirim", email = "izzetcyildirim@gmail.com" }]
maintainers = [{ name = "Izzet Yildirim", email = "izzetcyildirim@gmail.com" }]
requires-python = ">=3.10"
readme = { file = "README.md", content-type = "text/markdown" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = [
    "betterset>=0.2.0",
    "dask[bag,dataframe,distributed]>=2025.1.0,<2027.0.0",
    "dask_jobqueue>=0.9.0",
    "hydra-core~=1.3.0",
    "numpy>=2.1.0",
    "pandas>=2.3.0,<3.0.0",
    "portion>=2.4.0",
    "pyarrow>=18.0.0",
    "rich~=14.1.0",
    "strenum>=0.4",
    "structlog>=25",
    "dftracer-utils>=0.0.12",
]

[project.optional-dependencies]
web = ["streamlit>=1.60", "altair>=5.0"]
dev = ["pytest>=8.0", "pytest-forked>=1.6", "py>=1.11"]

[project.scripts]
dfanalyzer = "dftracer.analyzer.__main__:main"
dfanalyzer-cluster = "dftracer.analyzer.cluster:main"

[project.urls]
documentation = "https://dfanalyzer.readthedocs.io/en/latest/"
source = "https://github.com/LLNL/dfanalyzer"
tracker = "https://github.com/LLNL/dfanalyzer/issues"

[tool.setuptools.packages.find]
where = ["python"]
include = ["dftracer*"]
# dftracer is an implicit namespace package: it has no __init__.py so that
# dftracer.analyzer can coexist with the separately distributed dftracer package.
namespaces = true

[tool.setuptools.package-data]
"dftracer.analyzer" = ["configs/**/*.yaml", "configs/**/*.json"]

[tool.pyright]
exclude = ["build/", "tmp/"]

[tool.pytest.ini_options]
# --forked runs each test in its own process. Required because the C++
# aggregator's string-intern dictionary is a process-global static; without
# per-process isolation, indexes built across tests corrupt each other's
# interned IDs.
addopts = "--forked"
markers = [
    "smoke: minimal test subset for quick validation (select with '-m smoke')",
    "full: comprehensive test suite with all parameter combinations (select with '-m full')",
]
filterwarnings = [
    "ignore:The distutils package is deprecated and slated for removal.*:DeprecationWarning",
]

[tool.ruff]
line-length = 119

[tool.ruff.format]
quote-style = "preserve"

[tool.setuptools_scm]
local_scheme = "no-local-version"
version_file = "python/dftracer/analyzer/_version.py"
